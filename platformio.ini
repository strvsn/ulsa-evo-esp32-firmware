; PlatformIO Project Configuration File
; M5Stamp C3U profiles
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs =
    m5stamp-c3u
    m5stamp-c3u-initial

[ulsa_common]
platform = platformio/espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

lib_deps =
    https://github.com/m5stack/M5GFX.git#3944fedcaa7999b3c8943dfce972d804cb6dacc5
    https://github.com/m5stack/M5Unified.git#8108bfad04a20ff4e57c0751f62dd6fdf6b137a6
    https://github.com/adafruit/Adafruit_NeoPixel.git#d514fc3beae85dd4c2b19781b93faa47bd6e996f
    https://github.com/bxparks/AceCommon.git#8698645868ac4e6631b8fa3d8308d77377b507bd
    https://github.com/bxparks/AceSorting.git#e58dd60a3f3efb09e877c2c8a144f40627ba3359
    https://github.com/bxparks/AceTime.git#3dc2f58811e153e02bd16161da579dd201746372

lib_ldf_mode = deep+

monitor_speed = 115200
monitor_eol = LF
monitor_filters =
    esp32_exception_decoder
    time

board_build.partitions = partitions_ulsa_stm32pkg.csv
board_build.f_cpu = 160000000L

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_NEOPIXEL=1
    -DARDUINO_USB_CDC_CONNECTED_ON_BOOT=0
    -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
    -DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
    -DCONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER=1
    -Iinclude/commands
    -Iinclude/sensor
    -Iinclude/hardware
    -Iinclude/ota
    -Iinclude/system
    -Iinclude/config

upload_speed = 1500000
extra_scripts =
    pre:scripts/configure_reproducible_build.py

[env:m5stamp-c3u]
extends = ulsa_common
lib_deps =
    ${ulsa_common.lib_deps}
    https://github.com/h2zero/NimBLE-Arduino.git#e2b40749ef1e1aae9b1f5b2647d2bbadc5abb44f
build_flags =
    ${ulsa_common.build_flags}
    -DULSA_PROFILE_DEMO=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -Wl,--wrap=get_fattime
    -Iinclude/ble
    -Iinclude/storage
build_src_filter =
    +<*>
    -<main_initial.cpp>
    -<profile/initial_*.cpp>
extra_scripts =
    ${ulsa_common.extra_scripts}
    post:scripts/save_build_info.py

[env:m5stamp-c3u-initial]
extends = ulsa_common
lib_deps =
    ${ulsa_common.lib_deps}
build_flags =
    ${ulsa_common.build_flags}
    -DULSA_PROFILE_INITIAL=1
build_src_filter =
    +<main_initial.cpp>
    +<commands/cmd_help.cpp>
    +<commands/cmd_led.cpp>
    +<commands/cmd_rtc.cpp>
    +<commands/cmd_sys.cpp>
    +<commands/cmd_wind.cpp>
    +<commands/command_handler.cpp>
    +<commands/command_parser.cpp>
    +<hardware/led_controller.cpp>
    +<hardware/rtc_manager.cpp>
    +<hardware/rtc_timezone_database.cpp>
    +<hardware/stm32_bootloader.cpp>
    +<hardware/uart_bridge.cpp>
    +<ota/*>
    +<profile/initial_*.cpp>
    +<sensor/*>
    +<stm32_update/*>
    +<system/firmware_identity.cpp>
    +<system/task_stats.cpp>
    +<system/update_coordinator.cpp>

; Descriptive alias for interactive builds. Release builds use m5stamp-c3u so
; diagnostics and generated application data retain the established layout.
[env:m5stamp-c3u-demo]
extends = env:m5stamp-c3u
